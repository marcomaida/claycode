<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claycode Web Scanner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #header-container {
            width: 100%;
            background-color: #000;
        }

        #container {
            position: relative;
            width: 100vw;
            height: calc(100vh - 80pt);
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas {
            display: none;
        }

        #target-square {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(60vw, 60vh);
            height: min(60vw, 60vh);
            border: 3px solid rgba(240, 240, 240, 0.25);
            border-radius: 16px;
            pointer-events: none;
        }

        #info-box {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 18px;
        }

        #fps-counter {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }

        #resolution-label {
            position: absolute;
            top: 50px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10;
        }

        #result-modal {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #result-image {
            max-width: 80%;
            max-height: 60%;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        #result-text {
            font-size: 20px;
            background: white;
            color: black;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        #close-result {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            text-align: center;
        }

        @media (max-width: 480px) {
            #fps-counter, #resolution-label {
                font-size: 10px;
                padding: 4px 6px;
            }
            
            #toggle-processed-view {
                font-size: 10px !important;
                padding: 4px 6px !important;
            }
            
            #target-square {
                width: min(85vw, 85vh);
                height: min(85vw, 85vh);
            }
            
            #info-box {
                font-size: 14px;
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <div id="header-container">
        <!-- The header will be loaded by page_loader.js -->
        <div id="headerDiv"></div>
    </div>
    <div id="container">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>

        <div id="target-square"></div>

        <div id="fps-counter">0.0 FPS</div>
        <div id="resolution-label">-- x --</div>
        <div id="info-box">Touch to scan...</div>

        <button id="toggle-processed-view"
            style="position:absolute;top:10px;left:10px;z-index:10;padding:6px 8px;border-radius:4px;border:none;background:#222;color:#fff;cursor:pointer;font-size:12px;">
            Show Processed View
        </button>
        <canvas id="processed-canvas"
            style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none;"></canvas>

        <div id="result-modal">
           <img id="result-image" alt="Scanned image">
            <div id="result-text"></div>
            <button id="copy-button" style="background: #28a745; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; margin-bottom: 10px;">Copy to Clipboard</button>
            <button id="open-url-button" style="background: #17a2b8; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; margin-bottom: 10px; display: none;">Open URL</button>
            <button id="close-result">Continue Scanning</button>
        </div>

        <div id="loading">Loading OpenCV...</div>
    </div>

    <script src="https://docs.opencv.org/4.8.0/opencv.js"></script>
    <script type="module" src="../scan/scanner.js"></script>
    <!-- Scanner functionality is loaded from scanner.js module -->
</body>

</html>
