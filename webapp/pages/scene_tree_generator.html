<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="style.css" />
  <!-- <script src="https://pixijs.download/release/pixi.min.js"></script> -->
  <script src="../pixi.mini.js"></script>
  <script type="module" src="../page_loader.js"></script>
  <script type="module" src="/scenes/scene_tree_generator.js"></script>
</head>

<body style="margin: 0; height: 100vh;">
  <div id="mainContainer" style="display: flex; flex-direction: column; height: 100%;">

    <div id="headerDiv">
      <!-- Header content here -->
    </div>

    <div id="pixiDiv" style="flex: 1; overflow: hidden;">
      <!-- PIXI canvas or rendering target -->
    </div>

    <div id="footerDivTreeGen" class="tree-gen-footer-div">
      <div class="tree-gen-label">
        Max Node Children:
        <input type="number" id="inputMaxChildren" maxlength="4" value="10" class="tree_gen_val" />
      </div>
      <div class="tree-gen-label">
        Max Tree Height:
        <input type="number" id="inputMaxHeight" maxlength="4" value="3" class="tree_gen_val" />
      </div>
      <div class="tree-gen-label">
        Probability Of Growing:
        <input type="number" id="inputGrowProb" maxlength="4" value="0.5" step="0.1" max="1" min="0"
          class="tree_gen_val" />
      </div>
    </div>

    <!-- Optional info box (positioned in flow) -->
    <div class="tree-gen-info-box" id="tree-gen-info-box">
      <div id="infoText"></div>
      <div id="changeShapeDiv" class="change_shape_div">
        <img src="/images/enter.png" width="20" height="20" class="change_shape_img" />
        <run id="changeShapeText">Change Shape</run> <br />
        <img src="/images/space.png" width="40" height="25" class="change_shape_img" />Random Tree
      </div>
    </div>

  </div>
</body>


</html>
