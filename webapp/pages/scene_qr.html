<!doctype html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
    <!-- <script src="https://pixijs.download/release/pixi.min.js"></script> -->
    <script src="../pixi.mini.js"></script>
    <script type="module" src="../page_loader.js"></script>
    <script type="module" src="/scenes/scene_qr.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
</head>

<body style="margin: 0; height: 100vh;">
    <div class="elements-div" style="display: flex; height: 100%; flex-direction: column;">
        <div id="headerDiv"></div>

        <!-- Flex container for pixi and QR -->
        <div style="display: flex; flex: 1; height: 100%;">
            <div id="pixiDiv" class="pixi-div" style="flex: 1; height: 100%;"></div>
            <div id="qr-container"
                style="flex: 1; display: flex; align-items: center; justify-content: center; height: 100%;">
                <div id="qrcode"></div>
            </div>
        </div>

        <div class="performanceBoostDiv" style="display: flex; margin: 10pt; height: 10pt;">
            <div style="width: 200pt;">
                <input type="range" min="1.0" max="5.0" value="1.0" step="0.1" id="performanceBoostRange">
            </div>
            <div id="performanceBoostInfoText" style="font-size: 15pt; color: white; padding-left: 20pt;"> 1x
                performance </div>
        </div>

        <div id="footerDiv"></div>
    </div>
</body>


</html>
