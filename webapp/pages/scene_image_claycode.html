<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="style.css" />
  <!-- <script src="https://pixijs.download/release/pixi.min.js"></script> -->
  <script src="../pixi.mini.js"></script>
  <script type="module" src="../page_loader.js"></script>
  <script type="module" src="/scenes/scene_image_claycode.js"></script>
  <link rel="stylesheet" href="/image_processing/coloris.min.css" />
  <script src="/image_processing/coloris.min.js"></script>
  <script src="../geometry/martinez.min.js"></script>
</head>

<body style="position: relative;">
  <div id="mainDiv" class="elements-div">
    <div id="headerDiv"></div>
    <div id="pixiDiv" class="pixi-div" style="position: relative; flex:auto; display: flex; flex-direction: column;">
      <div id="spacerDiv" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
      </div>
    </div>

    <div style="margin: 5px 0 50px 0; font-size: 1.5em; color: #fff; text-align: center; width: 100%; font-family: Helvetica, sans-serif; font-weight: bold;">
      Drag an image with transparency to fill it with a claycode!
    </div>

    <div class="tree-gen-label" style="margin-left: 20pt;">
      Frame:
      <input class="color_picker" id="frameColorPicker" type="text" data-coloris value="#223d59">
      <run style="margin-left: 20pt;"></run>
      Color A:
      <input class="color_picker" id="colorAPicker" type="text" data-coloris value="#223d59">
      <run style="margin-left: 20pt;"></run>
      Color B:
      <input class="color_picker" id="colorBPicker" type="text" data-coloris value="#d3e7ee">
      <run style="margin-left: 20pt;"></run>
      Leaf A:
      <input class="color_picker" id="leafColorAPicker" type="text" data-coloris value="#faf8a8">
      <select name="Leaf Shape A" id="leafShapeAPicker"></select>
      <run style="margin-left: 20pt;"></run>
      Leaf B:
      <input class="color_picker" id="leafColorBPicker" type="text" data-coloris value="#a05a41">
      <select name="Leaf Shape B" id="leafShapeBPicker"></select>
      <run style="margin-left: 20pt;"></run>
    </div>
    <div id="footerDiv"></div>
  </div>
  <script type="text/javascript">
    Coloris.setInstance('.color_picker', {
      themeMode: 'dark',
      swatches: [
        '#264653',
        '#2a9d8f',
        '#e9c46a',
        '#f4a261',
        '#e76f51',
        '#d62828',
        '#023e8a',
        '#0077b6',
        '#0096c7',
        '#00b4d8',
        '#48cae4'
      ]
    })
  </script>
</body>

</html>
